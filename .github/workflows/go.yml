name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release with GoReleaser
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by GoReleaser to access Git history & tags

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code || (echo "go.mod or go.sum is not tidy" && exit 1)

      - name: Run Vet/Lint
        run: go vet ./...

      - name: Build mpterm with version
        run: |
          go mod tidy
          go generate ./...
          go build -ldflags "-X github.com/ad1822/mpterm/cmd.Version=${VERSION}" -o mpterm

      - name: Check version
        run: |
          ./mpterm --version
