version: 1

before:
  hooks:
  - go mod tidy
  - go generate ./...

builds:
- main: ./cmd/mpterm
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - windows
  - darwin
  ldflags:
  - -s -w -X github.com/ad1822/mpterm/cmd.Version={{ .Version }}

archives:
- format: tar.gz
  name_template: "{{ .ProjectName }}_{{ .Os }}_{{ if eq .Arch \"amd64\" }}x86_64{{ else if eq .Arch \"386\" }}i386{{ else }}{{ .Arch }}{{ end }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
  format_overrides:
  - goos: windows
    format: zip

changelog:
  sort: asc
  filters:
    exclude:
    - "^docs:"
    - "^test:"

release:
  draft: false
  name_template: "{{ .Tag }}"
